name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full main-branch commit SHA authorized for production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-abris-653915-com
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - name: Check out authorization verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Reject unauthorized branch or source
        run: node scripts/verify-production-authorization.mjs

  deploy:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://abris.653915.com
    env:
      CI: "true"
      ACCEPTED_EXECUTABLE_SOURCE_COMMIT: 1a683abd9a8294de5a36888e997e65aba7b7a167
      EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_commit }}
      DEPLOY_EVIDENCE_DIR: .production-deployment
    steps:
      - name: Check out authorized source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.9.0

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Verify production source identity
        run: |
          node -e 'if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_SOURCE_COMMIT) || process.env.EXPECTED_SOURCE_COMMIT !== process.env.GITHUB_SHA) process.exit(1)'
          git show --check --oneline --no-renames HEAD

      - name: Verify independently accepted executable source
        run: |
          git cat-file -e "$ACCEPTED_EXECUTABLE_SOURCE_COMMIT^{commit}"
          git diff --quiet "$ACCEPTED_EXECUTABLE_SOURCE_COMMIT" "$GITHUB_SHA" -- \
            apps \
            ':(exclude)apps/web/wrangler.jsonc' \
            packages \
            tests/fixtures/oxs \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.base.json

      - name: Verify production credentials exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_RULES_TOKEN: ${{ secrets.CLOUDFLARE_RULES_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_CACHE_PURGE_TOKEN"
          test -n "$CLOUDFLARE_RULES_TOKEN"
          test -n "$CLOUDFLARE_ZONE_ID"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build and verify accepted static output
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Rehearse Cloudflare bundle
        run: pnpm rehearse:deploy

      - name: Upload, smoke, promote, and verify production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_RULES_TOKEN: ${{ secrets.CLOUDFLARE_RULES_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node scripts/deploy-production.mjs

      - name: Retain production deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-deployment-${{ github.sha }}-${{ github.run_id }}
          path: .production-deployment/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
